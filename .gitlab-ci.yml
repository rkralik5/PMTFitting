# GitLab CI/CD pipeline for od-qa-analysis repository
#
# Currently defines one job: generating and publishing Doxygen documentation
# via GitLab Pages. A compilation check job can be added here in the future
# once a suitable Docker image with ROOT and Boost is available.

pages:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq doxygen graphviz
  script:
    - doxygen Doxyfile
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
